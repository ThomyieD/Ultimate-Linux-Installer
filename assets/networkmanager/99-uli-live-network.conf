# Ubuntu's minimal/server NetworkManager package defaults to leaving Ethernet
# devices unmanaged.  The live installer owns networking while it is running,
# so explicitly make wired and Wi-Fi hardware available to NetworkManager.
[main]
# Noble ships a vendor drop-in that selects the systemd-resolved plugin, but
# the minimal live image does not ship systemd-resolved itself.  Use NM's
# direct resolver file instead; /etc/resolv.conf points to that runtime file.
dns=default
rc-manager=file

[ifupdown]
managed=true

[keyfile]
unmanaged-devices=*,except:type:ethernet,except:type:wifi,except:type:gsm,except:type:cdma

[device-uli-live-ethernet]
match-device=type:ethernet
managed=true

[device-uli-live-wifi]
match-device=type:wifi
managed=true
