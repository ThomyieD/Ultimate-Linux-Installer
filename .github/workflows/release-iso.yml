name: Build and optionally publish ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ISO version (for example 0.3.0)"
        required: true
        default: "0.3.0"
      release_tag:
        description: "Existing release tag; leave empty to build without publishing"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install test and build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            debootstrap qemu-system-x86 qemu-utils ovmf xorriso squashfs-tools \
            grub-efi-amd64-bin grub-pc-bin isolinux syslinux-common \
            dosfstools mtools rsync curl shellcheck python3-venv

      - name: Run automated tests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            ''|*[!0-9A-Za-z.-]*) echo "Invalid version" >&2; exit 2 ;;
          esac
          test "$VERSION" = "$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n1)"
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --disable-pip-version-check -e '.[dev]'
          .ci-venv/bin/pytest -q
          .ci-venv/bin/ruff check app adapters tests
          shellcheck scripts/build-iso.sh scripts/build-iso-simple.sh \
            scripts/lib-runtime-bundle.sh \
            scripts/lib-debian-archive-keyring.sh \
            scripts/generate-theme-assets.sh scripts/install-firefox-tarball.sh \
            scripts/lib-iso-uefi.sh scripts/verify-iso-uefi.sh

      - name: Build ISO
        env:
          ULI_VERSION: ${{ inputs.version }}
        run: sudo --preserve-env=ULI_VERSION bash scripts/build-iso.sh

      - name: Verify hybrid UEFI image
        env:
          VERSION: ${{ inputs.version }}
        run: sudo bash scripts/verify-iso-uefi.sh "artifacts/ultimate-linux-installer-${VERSION}-amd64.iso"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-linux-installer-${{ inputs.version }}
          path: |
            artifacts/ultimate-linux-installer-${{ inputs.version }}-amd64.iso
            artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Attach assets to an explicitly selected release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$VERSION"
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "artifacts/ultimate-linux-installer-${VERSION}-amd64.iso" \
            artifacts/SHA256SUMS --clobber
