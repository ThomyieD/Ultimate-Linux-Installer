[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultimate-linux-installer"
version = "0.1.0"
description = "Modern UEFI multiboot Linux installation platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ultimate Linux Installer contributors" }]
keywords = ["linux", "installer", "multiboot", "uefi", "grub"]
dependencies = [
  "PySide6>=6.6",
  "PyYAML>=6.0",
  "requests>=2.31",
  "jsonschema>=4.21",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
ui-dev = [
  "pytest-qt>=4.4",
]

[project.scripts]
uli = "uli.main:main"

[tool.setuptools.packages.find]
where = ["app"]

[tool.setuptools.package-data]
uli = ["i18n/*.json", "ui/styles/*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
